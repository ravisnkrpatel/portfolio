<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>404 — ravisnkr.portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%23000000'/%3E%3Ctext x='155' y='270' font-family='Helvetica Neue,Arial,sans-serif' font-size='280' font-weight='700' fill='%23e8e8e8' letter-spacing='-10'%3Er%3C/text%3E%3Ccircle cx='259' cy='251' r='19' fill='%233dffa3'/%3E%3C/svg%3E"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--fg:#ededed;
  --fg-soft:rgba(237,237,237,.7);
  --fg-muted:rgba(237,237,237,.4);
  --border:rgba(237,237,237,.08);
  --surface:rgba(237,237,237,.04);
  --accent:#3dffa3;
}
[data-theme="light"]{
  --bg:#fafafa;--fg:#0a0a0a;
  --fg-soft:rgba(10,10,10,.68);
  --fg-muted:rgba(10,10,10,.45);
  --border:rgba(10,10,10,.08);
  --surface:rgba(10,10,10,.03);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Geist',-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  transition:background .35s,color .35s;
}
::selection{background:var(--fg);color:var(--bg)}

.theme-toggle{
  position:fixed;top:1.4rem;right:1.4rem;
  z-index:100;
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.55rem 1.1rem;
  background:rgba(20,20,20,.65);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(237,237,237,.08);
  border-radius:999px;
  color:var(--fg-soft);
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;letter-spacing:.06em;
  cursor:pointer;
  transition:all .3s cubic-bezier(.16,1,.3,1);
}
[data-theme="light"] .theme-toggle{
  background:rgba(250,250,250,.78);
  border-color:rgba(10,10,10,.06);
}
.theme-toggle:hover{color:var(--fg);border-color:rgba(237,237,237,.18)}
[data-theme="light"] .theme-toggle:hover{border-color:rgba(10,10,10,.18)}
.theme-toggle .icon-light{display:none}
.theme-toggle .icon-dark{display:block}
[data-theme="light"] .theme-toggle .icon-light{display:block}
[data-theme="light"] .theme-toggle .icon-dark{display:none}

.wrap{
  text-align:center;
  padding:2rem;
  max-width:520px;
  width:100%;
  animation:fade-in .9s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fade-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.code{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(5rem,18vw,9rem);
  font-weight:500;
  line-height:1;
  letter-spacing:-.04em;
  color:var(--fg);
  margin-bottom:1.5rem;
}
.code .accent{color:var(--accent)}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--fg-muted);
  margin-bottom:2.5rem;
}

.msg{
  font-size:1.05rem;
  color:var(--fg-soft);
  line-height:1.65;
  margin-bottom:2.5rem;
  max-width:380px;
  margin-left:auto;margin-right:auto;
}

.countdown{
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;letter-spacing:.12em;
  color:var(--fg-muted);
  margin-bottom:2rem;
}
.countdown span{color:var(--accent)}

.home-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.7rem 1.5rem;
  background:var(--fg);color:var(--bg);
  border:none;border-radius:999px;
  font-family:'Geist',inherit;font-size:.82rem;font-weight:500;
  letter-spacing:-.005em;
  text-decoration:none;cursor:pointer;
  transition:opacity .2s,transform .2s;
}
.home-btn:hover{opacity:.85;transform:translateY(-1px)}

.foot{
  position:fixed;bottom:1.4rem;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:0 1.8rem;
  pointer-events:none;
}
.foot-l,.foot-r{
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;letter-spacing:.1em;
  color:var(--fg-muted);
  text-transform:uppercase;
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
  <svg class="icon-light" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  <svg class="icon-dark" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="wrap">
  <div class="code"><span class="accent">4</span>0<span class="accent">4</span></div>
  <div class="eyebrow">Page not found</div>
  <p class="msg">This page doesn't exist. Whatever you were looking for, it's not here — but I am, one click away.</p>
  <div class="countdown">Redirecting in <span id="cd">10</span>s</div>
  <a href="https://ravishankarpatel.in" class="home-btn">← Back to home</a>
</div>

<div class="foot">
  <span class="foot-l">ravishankarpatel.in</span>
  <span class="foot-r">PSR.</span>
</div>

<script>
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('psr-theme', next);
}
(function(){
  const t = localStorage.getItem('psr-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();

(function(){
  let t = 10;
  const el = document.getElementById('cd');
  const iv = setInterval(() => {
    t--;
    el.textContent = t;
    if(t <= 0){ clearInterval(iv); window.location.href = 'https://ravishankarpatel.in'; }
  }, 1000);
})();
</script>
</body>
</html>
