<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'" />
  <meta name="theme-color" id="metaTheme" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('psr-theme') || 'dark'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var m = document.getElementById('metaTheme');
      if (m) m.setAttribute('content', t === 'light' ? '#fafafa' : '#0a0a0a');
    })();
  </script>
  <title>Vault</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="lib/jspdf.umd.min.js" defer></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --bg-raised: #121212;
      --bg-sheet: #151515;
      --fg: #ededed;
      --fg-soft: rgba(237, 237, 237, .72);
      --fg-muted: rgba(237, 237, 237, .48);
      --fg-faint: rgba(237, 237, 237, .2);
      --border: rgba(237, 237, 237, .09);
      --border-strong: rgba(237, 237, 237, .16);
      --surface: rgba(237, 237, 237, .035);
      --surface-2: rgba(237, 237, 237, .07);
      --surface-3: rgba(237, 237, 237, .11);
      --accent: #a78bfa;
      --accent-ink: #12062b;
      --accent-soft: rgba(167, 139, 250, .14);
      --danger: #ff6b6b;
      --c-sales: #3dffa3;
      --c-purchase: #6cb6ff;
      --c-delivery: #ffb347;
      --c-urd: #2dd4bf;
      --c-expense: #ff8fa3;
      --c-other: #b0b0b0;
      --r-sm: 10px;
      --r: 14px;
      --r-lg: 20px;
      --shadow: 0 24px 64px -12px rgba(0, 0, 0, .7), 0 0 0 1px var(--border);
      --shadow-sm: 0 8px 24px -8px rgba(0, 0, 0, .6);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    [data-theme="light"] {
      --bg: #f6f6f4;
      --bg-raised: #ffffff;
      --bg-sheet: #ffffff;
      --fg: #0a0a0a;
      --fg-soft: rgba(10, 10, 10, .7);
      --fg-muted: rgba(10, 10, 10, .5);
      --fg-faint: rgba(10, 10, 10, .18);
      --border: rgba(10, 10, 10, .08);
      --border-strong: rgba(10, 10, 10, .14);
      --surface: rgba(10, 10, 10, .025);
      --surface-2: rgba(10, 10, 10, .05);
      --surface-3: rgba(10, 10, 10, .08);
      --accent: #7c3aed;
      --accent-ink: #ffffff;
      --accent-soft: rgba(124, 58, 237, .1);
      --danger: #d93636;
      --c-sales: #0f9e6b;
      --c-purchase: #2f7fd8;
      --c-delivery: #c77700;
      --c-urd: #0d9488;
      --c-expense: #d6416a;
      --c-other: #6b6b6b;
      --shadow: 0 24px 64px -16px rgba(0, 0, 0, .22), 0 0 0 1px var(--border);
      --shadow-sm: 0 8px 24px -10px rgba(0, 0, 0, .18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ---------- icons ---------- */
    .i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .i.sm { width: 16px; height: 16px; }
    .i.lg { width: 24px; height: 24px; }

    /* ---------- buttons & inputs ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 16px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      font-weight: 500; font-size: 15px; white-space: nowrap; letter-spacing: -.005em;
      transition: background .15s, border-color .15s, opacity .15s, transform .1s var(--ease), box-shadow .15s;
    }
    .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn.primary {
      background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600;
      box-shadow: 0 6px 20px -8px var(--accent);
    }
    .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
    .btn.danger { color: var(--danger); }
    .btn.ghost { background: transparent; border-color: transparent; }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.icon { width: 44px; padding: 0; }
    .btn.round { border-radius: 999px; }
    .btn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    .field { display: grid; gap: 7px; }
    .field > label { font-size: 13px; font-weight: 500; color: var(--fg-muted); }
    .control { position: relative; display: flex; align-items: center; }
    .control > .i { position: absolute; left: 14px; color: var(--fg-muted); pointer-events: none; }
    .input {
      height: 48px; width: 100%; padding: 0 14px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border); outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .control > .i + .input { padding-left: 42px; }
    .input:hover { border-color: var(--border-strong); }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-raised); }
    .input::placeholder { color: var(--fg-muted); }
    select.input { appearance: none; -webkit-appearance: none; padding-right: 38px; cursor: pointer; font-weight: 500; }
    select.input option { background: var(--bg-raised); color: var(--fg); }
    .control .caret { left: auto; right: 14px; }
    input[type="date"].input { min-width: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- logo ---------- */
    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 6px 18px -6px var(--accent);
    }
    .logo .i { width: 20px; height: 20px; stroke-width: 2; }

    /* ---------- login ---------- */
    #login {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      background:
        radial-gradient(600px 400px at 50% -10%, var(--accent-soft), transparent 70%),
        var(--bg);
      position: relative; overflow: hidden;
    }
    #login::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(500px 360px at 50% 30%, #000, transparent 75%);
      -webkit-mask-image: radial-gradient(500px 360px at 50% 30%, #000, transparent 75%);
      opacity: .6;
    }
    .login-card {
      position: relative; width: 100%; max-width: 400px; display: grid; gap: 18px;
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px 24px 24px; box-shadow: var(--shadow);
      animation: rise .35s var(--ease);
    }
    .login-head { display: grid; justify-items: center; text-align: center; gap: 6px; margin-bottom: 6px; }
    .login-head .logo { width: 52px; height: 52px; border-radius: 16px; margin-bottom: 10px; }
    .login-head .logo .i { width: 28px; height: 28px; }
    .login-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
    .login-head h1.sat { font-size: 34px; font-weight: 700; letter-spacing: .42em; margin-right: -.42em; line-height: 1.1; }
    .login-head p { color: var(--fg-muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .pw-wrap .input { padding-right: 52px; }
    .pw-wrap .eye { position: absolute; right: 4px; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--fg-muted); }
    .pw-wrap .eye:hover { color: var(--fg); background: var(--surface-2); }
    .error { color: var(--danger); font-size: 14px; min-height: 20px; display: flex; gap: 6px; align-items: flex-start; }
    .error:empty { min-height: 0; }
    #loginErr:empty { display: none; }
    .login-card .btn.primary { height: 50px; font-size: 16px; }
    .login-foot { text-align: center; font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px; }

    /* ---------- header ---------- */
    header.top {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: saturate(1.5) blur(14px); -webkit-backdrop-filter: saturate(1.5) blur(14px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    header.top .wrap { height: 64px; display: flex; align-items: center; gap: 6px; }
    .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; min-width: 0; }
    .brand .logo { width: 32px; height: 32px; border-radius: 9px; }
    .brand .logo .i { width: 18px; height: 18px; }
    .brand b { font-weight: 600; font-size: 17px; letter-spacing: -.015em; }
    .user {
      display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 4px; margin-right: 4px;
      border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); min-width: 0;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex: none;
      display: grid; place-items: center; font-weight: 600; font-size: 14px; text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ec4899));
      color: var(--accent-ink);
    }
    .avatar.img { background: #000; box-shadow: 0 0 0 1px var(--border-strong); overflow: hidden; }
    .avatar img { width: 100%; height: 100%; display: block; }
    .user .uname { font-size: 14px; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .btn.icon { width: 40px; height: 40px; border-radius: 999px; color: var(--fg-soft); }
    header .btn.icon:hover { color: var(--fg); }
    [data-theme="dark"] .t-moon, [data-theme="light"] .t-sun { display: none; }
    @media (max-width: 520px) {
      .user { padding: 4px; height: 40px; }
      .user .uname { display: none; }
      .brand b { font-size: 16px; }
    }

    /* ---------- add-bill card ---------- */
    .hero {
      margin-top: 20px; padding: 18px; border-radius: var(--r-lg);
      background:
        radial-gradient(420px 160px at 0% 0%, var(--accent-soft), transparent 70%),
        var(--bg-raised);
      border: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px 20px;
    }
    .hero-text h2 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
    .hero-text p { font-size: 14px; color: var(--fg-muted); margin-top: 2px; }
    .hero-actions { display: flex; gap: 10px; }
    .hero .btn { height: 56px; border-radius: 16px; font-size: 16px; padding: 0 22px; }
    .hero .btn.primary { padding: 0 26px; }
    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; padding: 16px; }
      .hero-actions { display: grid; grid-template-columns: 1fr auto; }
      .hero .btn { height: 60px; }
      .hero .btn.primary { font-size: 17px; }
    }
    @media (max-width: 400px) { .hero #galBtn span { display: none; } .hero #galBtn { width: 60px; padding: 0; } }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; gap: 8px; padding: 22px 0 12px; align-items: center; }
    .toolbar .month { flex: none; width: 224px; }
    .toolbar .search { flex: 1; }
    .toolbar .btn { height: 48px; }
    .toolbar .btn.icon { width: 48px; }
    #selectBtn { min-width: 92px; }
    @media (max-width: 640px) {
      .toolbar { flex-wrap: wrap; }
      .toolbar .search { order: -1; flex-basis: 100%; }
      .toolbar .month { flex: 1; width: auto; min-width: 0; }
    }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; flex: none;
      height: 38px; padding: 0 8px 0 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--fg-soft);
      transition: background .15s, border-color .15s, color .15s;
    }
    .chip:hover { border-color: var(--border-strong); color: var(--fg); }
    .chip .i { color: var(--c, var(--fg-muted)); }
    .chip .n {
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
      font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: var(--surface-2); color: var(--fg-muted);
    }
    .chip.all { padding-left: 14px; }
    .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .chip[aria-pressed="true"] .i { color: inherit; }
    .chip[aria-pressed="true"] .n { background: color-mix(in srgb, var(--bg) 18%, transparent); color: inherit; }

    /* ---------- list ---------- */
    .day { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
    .day h3 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .day .cnt { font-size: 12px; font-weight: 500; color: var(--fg-muted); background: var(--surface-2); border-radius: 999px; padding: 2px 9px; }
    .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; }
    @media (max-width: 440px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
    .card {
      position: relative; text-align: left; border-radius: var(--r); overflow: hidden;
      background: var(--bg-raised); border: 1px solid var(--border);
      transition: border-color .2s, transform .2s var(--ease), box-shadow .2s;
      display: flex; flex-direction: column;
    }
    @media (hover: hover) { .card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm); } }
    .card:active { transform: scale(.98); }
    .card .thumb { position: relative; aspect-ratio: 4 / 5; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .card .thumb > .i { width: 34px; height: 34px; color: var(--fg-faint); stroke-width: 1.4; }
    .card .thumb::after { content: ""; position: absolute; inset: auto 0 0 0; height: 30%; background: linear-gradient(transparent, rgba(0,0,0,.22)); pointer-events: none; }
    .tag {
      position: absolute; left: 8px; bottom: 8px; z-index: 1;
      display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: .02em; color: #fff;
      background: rgba(12,12,12,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.12);
    }
    .tag .i { width: 13px; height: 13px; stroke-width: 2.2; color: var(--c); }
    [data-theme="light"] .tag .i { filter: brightness(1.5) saturate(1.2); }
    .seq {
      position: absolute; right: 8px; top: 8px; z-index: 1; height: 22px; padding: 0 7px; border-radius: 7px;
      display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
      background: rgba(12,12,12,.62); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.12);
    }
    .card .meta { padding: 10px 12px 12px; display: grid; gap: 2px; min-width: 0; }
    .card .name { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .sub { font-size: 12.5px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .check {
      position: absolute; top: 8px; left: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid #fff; background: rgba(0,0,0,.3); display: none; place-items: center; color: var(--accent-ink);
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .card .check .i { width: 15px; height: 15px; stroke-width: 3; opacity: 0; }
    .selecting .card .check { display: grid; }
    .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .card.sel .check { background: var(--accent); border-color: var(--accent); }
    .card.sel .check .i { opacity: 1; }
    .card.sel .thumb img { opacity: .85; }

    .empty { text-align: center; padding: 56px 16px 40px; color: var(--fg-muted); display: grid; justify-items: center; gap: 6px; }
    .empty .ring {
      width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; margin-bottom: 10px;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--fg-soft);
    }
    .empty .ring .i { width: 30px; height: 30px; stroke-width: 1.5; }
    .empty h4 { color: var(--fg); font-size: 16px; font-weight: 600; }
    .empty p { font-size: 14px; max-width: 280px; }
    .empty .btn { margin-top: 14px; }
    .loading { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; padding-top: 44px; }
    @media (max-width: 440px) { .loading { grid-template-columns: 1fr 1fr; gap: 10px; } }
    .skel { aspect-ratio: 4 / 5.8; border-radius: var(--r); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; border: 1px solid var(--border); }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }

    /* ---------- selection bar ---------- */
    .selbar {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
      bottom: calc(14px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 560px;
      background: var(--bg-sheet); border: 1px solid var(--border-strong); border-radius: 20px;
      padding: 8px; box-shadow: var(--shadow);
      display: flex; gap: 6px; align-items: center; animation: rise .25s var(--ease);
    }
    .selbar .count { margin-right: auto; padding-left: 10px; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .selbar .count b { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; }
    .selbar .btn { height: 44px; }
    .has-selbar main { padding-bottom: 100px; }
    @media (max-width: 480px) { .selbar .lbl { display: none; } .selbar .btn { padding: 0 13px; } }

    /* ---------- sheet ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      animation: fade .2s ease;
    }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } }
    .selbar { animation-name: selUp; }
    @keyframes selUp { from { transform: translate(-50%, 16px); opacity: 0; } }
    .sheet {
      width: 100%; max-width: 560px; max-height: 94vh; max-height: 94dvh; overflow-y: auto;
      background: var(--bg-sheet); border-top: 1px solid var(--border-strong);
      border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
      padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
      display: grid; gap: 16px; animation: sheetUp .3s var(--ease);
    }
    .sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--fg-faint); justify-self: center; margin-bottom: -4px; }
    @media (min-width: 640px) {
      .overlay { align-items: center; padding: 24px; }
      .sheet { border-radius: 24px; border: 1px solid var(--border-strong); padding: 22px; }
      .sheet .grab { display: none; }
    }
    .sheet-head { display: flex; align-items: center; gap: 10px; }
    .sheet-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -.015em; margin-right: auto; }
    .sheet-head .q { font-size: 12px; font-weight: 600; color: var(--fg-soft); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; }
    .sheet-head .q:empty { display: none; }
    .sheet-head .btn.icon { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); }
    .preview {
      position: relative; border-radius: 16px; overflow: hidden; display: grid; place-items: center;
      height: 34vh; min-height: 190px; border: 1px solid var(--border);
      background: repeating-conic-gradient(var(--surface-2) 0 25%, transparent 0 50%) 0 0 / 18px 18px, var(--surface);
    }
    .preview canvas { max-width: 100%; max-height: 100%; display: block; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .preview .rot {
      position: absolute; right: 10px; bottom: 10px; height: 38px; padding: 0 13px 0 11px; border-radius: 999px; font-size: 13px;
      background: rgba(12,12,12,.7); color: #fff; border-color: rgba(255,255,255,.18);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .preview .rot:hover { background: rgba(12,12,12,.85); }
    .sec-label { font-size: 13px; font-weight: 500; color: var(--fg-muted); margin-bottom: -8px; display: flex; justify-content: space-between; }
    .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .type {
      position: relative; height: 74px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface);
      display: grid; place-items: center; align-content: center; gap: 6px; font-weight: 500; font-size: 13.5px; padding: 0 6px; text-align: center; line-height: 1.15;
      transition: border-color .15s, background .15s, transform .1s var(--ease);
    }
    .type:hover { border-color: var(--border-strong); }
    .type:active { transform: scale(.97); }
    .type .ic {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c);
    }
    .type .ic .i { width: 17px; height: 17px; stroke-width: 2; }
    .type[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); }
    .type[aria-checked="true"] .ic { background: var(--c); color: var(--bg); }
    .type[aria-checked="true"]::after {
      content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--c);
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 360px) { .row2 { grid-template-columns: 1fr; } }
    .filename {
      display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 14px;
      background: var(--surface); border: 1px dashed var(--border-strong); font-size: 13px; color: var(--fg-muted); min-height: 58px;
    }
    .filename .fi { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-soft); }
    .filename.ready { border-style: solid; border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 6%, transparent); }
    .filename.ready .fi { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
    .filename .fn { display: grid; min-width: 0; line-height: 1.4; }
    .filename b { font-family: 'JetBrains Mono', monospace; color: var(--fg); font-weight: 500; font-size: 12.5px; overflow-wrap: anywhere; }
    .filename small { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .sheet-actions { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
    .sheet-actions .btn { height: 54px; border-radius: 14px; font-size: 16px; }

    /* ---------- viewer ---------- */
    #viewer { position: fixed; inset: 0; z-index: 60; background: #050505; display: flex; flex-direction: column; color: #ededed; animation: fade .2s ease; }
    #viewer .vhead {
      position: absolute; inset: 0 0 auto 0; z-index: 2; display: flex; align-items: center; gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 26px;
      background: linear-gradient(rgba(5,5,5,.88), rgba(5,5,5,0));
    }
    #viewer .vhead .t { margin-right: auto; min-width: 0; padding-left: 4px; }
    #viewer .vhead .t div { font-family: 'JetBrains Mono', monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #viewer .vhead .t small { color: rgba(237,237,237,.55); font-size: 12px; }
    #viewer .vbody { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; touch-action: pan-y pinch-zoom; padding: 64px 0 0; }
    #viewer .vbody img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
    #viewer .btn { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.1); color: #ededed; }
    #viewer .btn:hover { background: rgba(255,255,255,.15); }
    #viewer .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    #viewer .btn.danger { color: #ff7b7b; }
    #viewer .btn.round { width: 42px; height: 42px; border-radius: 50%; padding: 0; }
    #viewer .btn.nav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; padding: 0;
      background: rgba(10,10,10,.6); border-color: rgba(255,255,255,.2); color: #fff;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    #viewer .btn.nav:active { transform: translateY(-50%) scale(.94); }
    #viewer .nav.prev { left: 12px; } #viewer .nav.next { right: 12px; }
    #viewer .vfoot { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
    #viewer .vpanel {
      max-width: 620px; margin: 0 auto; display: grid; gap: 12px; padding: 12px;
      background: rgba(22,22,22,.92); border: 1px solid rgba(255,255,255,.09); border-radius: 20px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    #viewer .vinfo { display: flex; flex-wrap: wrap; gap: 6px; }
    #viewer .pill {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px;
      background: rgba(255,255,255,.07); font-size: 12.5px; color: rgba(237,237,237,.8);
    }
    #viewer .pill .i { width: 14px; height: 14px; color: rgba(237,237,237,.55); }
    #viewer .pill.cat { color: #fff; font-weight: 600; background: color-mix(in srgb, var(--c) 20%, transparent); }
    #viewer .pill.cat .i { color: var(--c); stroke-width: 2.2; }
    #viewer .vacts { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
    #viewer .vacts .btn { height: 48px; border-radius: 14px; }
    #viewer .vacts .btn.icon { width: 48px; }

    /* ---------- toast ---------- */
    #toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 80; max-width: calc(100% - 32px); width: max-content;
      display: flex; align-items: center; gap: 10px;
      background: var(--fg); color: var(--bg); padding: 11px 16px 11px 12px; border-radius: 999px; font-size: 14px; font-weight: 500;
      box-shadow: 0 12px 40px -8px rgba(0,0,0,.5); animation: toastIn .3s var(--ease);
    }
    @keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } }
    #toast .ti { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
    #toast .ti .i { width: 14px; height: 14px; stroke-width: 3; }
    #toast span { overflow: hidden; text-overflow: ellipsis; }
    #toast.err { background: var(--danger); color: #fff; }
    #toast.err .ti { background: rgba(255,255,255,.22); color: #fff; }
    .has-selbar #toast { bottom: calc(92px + env(safe-area-inset-bottom)); }

    footer.foot { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 44px 16px 32px; font-size: 12px; color: var(--fg-muted); }
    footer.foot .i { width: 14px; height: 14px; }
  </style>
</head>

  <!-- ============ LOGIN ============ -->
  <main id="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-head">
        <div class="logo"><svg class="i"><use href="#i-vault"/></svg></div>
        <h1 class="sat">SAT</h1>
        <p><svg class="i sm"><use href="#i-lock"/></svg>Private access only</p>
      </div>
      <div class="field">
        <label for="u">Username</label>
        <div class="control">
          <svg class="i"><use href="#i-user"/></svg>
          <input class="input" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <div class="control pw-wrap">
          <svg class="i"><use href="#i-lock"/></svg>
          <input class="input" id="p" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="eye" id="pwToggle" aria-label="Show password"><svg class="i"><use href="#i-eye"/></svg></button>
        </div>
      </div>
      <div class="error" id="loginErr" role="alert"></div>
      <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
      <div class="login-foot"><svg class="i sm"><use href="#i-shield"/></svg>Files stay in a private Google Drive</div>
    </form>
  </main>

  <!-- ============ APP ============ -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap">
        <div class="brand"><div class="logo"><svg class="i"><use href="#i-vault"/></svg></div><b>Vault</b></div>
        <div class="user" title="Signed in"><span class="avatar" id="avatar"></span><span class="uname" id="who"></span></div>
        <button class="btn icon ghost" id="themeBtn" title="Switch theme" aria-label="Switch theme">
          <svg class="i t-sun"><use href="#i-sun"/></svg><svg class="i t-moon"><use href="#i-moon"/></svg>
        </button>
        <button class="btn icon ghost" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="btn icon ghost" id="logoutBtn" title="Sign out" aria-label="Sign out"><svg class="i"><use href="#i-logout"/></svg></button>
      </div>
    </header>

    <main class="wrap" id="main">
      <section class="hero">
        <div class="hero-text">
          <h2>Add a bill</h2>
          <p>Snap it — it’s named, numbered and filed for you.</p>
        </div>
        <div class="hero-actions">
          <button class="btn primary" id="camBtn"><svg class="i lg"><use href="#i-camera"/></svg>Take photo</button>
          <button class="btn" id="galBtn" title="Upload from gallery" aria-label="Upload from gallery"><svg class="i lg"><use href="#i-image"/></svg><span>Gallery</span></button>
        </div>
      </section>

      <section class="toolbar">
        <div class="control month">
          <svg class="i"><use href="#i-calendar"/></svg>
          <select class="input" id="monthSel" aria-label="Month"></select>
          <svg class="i sm caret"><use href="#i-chev-down"/></svg>
        </div>
        <div class="control search">
          <svg class="i"><use href="#i-search"/></svg>
          <input class="input" id="search" type="search" placeholder="Search name, note, date…" aria-label="Search" />
        </div>
        <button class="btn icon" id="sortBtn" title="Newest first" aria-label="Change order"><svg class="i"><use href="#i-sort-desc"/></svg></button>
        <button class="btn" id="selectBtn"><svg class="i"><use href="#i-check-sq"/></svg><span>Select</span></button>
      </section>
      <nav class="chips" id="chips" aria-label="Filter by type"></nav>

      <section id="list"></section>
    </main>
    <footer class="foot"><svg class="i"><use href="#i-shield"/></svg>Stored in a private Google Drive folder</footer>

    <div class="selbar" id="selbar" hidden>
      <span class="count" id="selCount">0 selected</span>
      <button class="btn" id="selAll">All</button>
      <button class="btn" id="selPng" disabled><svg class="i"><use href="#i-download"/></svg>PNG<span class="lbl">s</span></button>
      <button class="btn primary" id="selPdf" disabled><svg class="i"><use href="#i-download"/></svg><span class="lbl">One </span>PDF</button>
    </div>
  </div>

  <!-- ============ SAVE SHEET ============ -->
  <div class="overlay" id="saveSheet" hidden>
    <form class="sheet" id="saveForm">
      <div class="grab"></div>
      <div class="sheet-head">
        <h2>What is this bill?</h2>
        <span class="q" id="queueInfo"></span>
        <button type="button" class="btn icon" id="saveClose" aria-label="Cancel"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="preview">
        <canvas id="previewCanvas"></canvas>
        <button type="button" class="btn rot" id="rotBtn" title="Rotate"><svg class="i sm"><use href="#i-rotate"/></svg>Rotate</button>
      </div>
      <div class="sec-label">Bill type</div>
      <div class="types" id="types" role="radiogroup" aria-label="Bill type"></div>
      <div class="row2">
        <div class="field">
          <label for="billDate">Bill date</label>
          <input class="input" id="billDate" type="date" required />
        </div>
        <div class="field">
          <label for="billNote">Note <span style="opacity:.7">(optional)</span></label>
          <input class="input" id="billNote" maxlength="120" placeholder="e.g. party name" />
        </div>
      </div>
      <div class="filename" id="fileHint"></div>
      <div class="error" id="saveErr" role="alert"></div>
      <div class="sheet-actions">
        <button type="button" class="btn" id="retakeBtn"><svg class="i"><use href="#i-camera"/></svg>Retake</button>
        <button type="submit" class="btn primary" id="saveBtn" disabled><svg class="i"><use href="#i-cloud"/></svg>Save to Drive</button>
      </div>
    </form>
  </div>

  <!-- ============ VIEWER ============ -->
  <div id="viewer" hidden>
    <div class="vhead">
      <div class="t"><div id="vName"></div><small id="vPos"></small></div>
      <button class="btn round" id="vClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="vbody" id="vBody">
      <div class="spinner" id="vSpin"></div>
      <img id="vImg" alt="" hidden />
      <button class="btn nav prev" id="vPrev" aria-label="Previous"><svg class="i"><use href="#i-chev-left"/></svg></button>
      <button class="btn nav next" id="vNext" aria-label="Next"><svg class="i"><use href="#i-chev-right"/></svg></button>
    </div>
    <div class="vfoot">
      <div class="vpanel">
        <div class="vinfo" id="vInfo"></div>
        <div class="vacts">
          <button class="btn" id="vPng"><svg class="i"><use href="#i-download"/></svg>PNG</button>
          <button class="btn primary" id="vPdf"><svg class="i"><use href="#i-download"/></svg>PDF</button>
          <button class="btn icon danger" id="vDel" aria-label="Delete" title="Delete"><svg class="i"><use href="#i-trash"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status" hidden></div>
  <input type="file" id="camIn" accept="image/*" capture="environment" hidden />
  <input type="file" id="galIn" accept="image/*" multiple hidden />

  <script>
  (function () {
    'use strict';

    // ===== Config =====
    var API = 'https://script.google.com/macros/s/AKfycby13c2yQqicLm5rK6Y8a0itWkWlw324a8TeLOjK6qzze-rrVYsUwhsW4YzIa3K1WsC5/exec';
    var CATS = [
      { k: 'SALES', label: 'Sales', c: '--c-sales', ic: 'sales' },
      { k: 'PURCHASE', label: 'Purchase', c: '--c-purchase', ic: 'purchase' },
      { k: 'DELIVERY', label: 'Delivery Note', c: '--c-delivery', ic: 'delivery' },
      { k: 'URD', label: 'URD Bill', c: '--c-urd', ic: 'urd' },
      { k: 'EXPENSE', label: 'Expense', c: '--c-expense', ic: 'expense' },
      { k: 'OTHER', label: 'Other', c: '--c-other', ic: 'other' }
    ];
    var CAT = {}; CATS.forEach(function (c) { CAT[c.k] = c; });
    var AVATARS = { ravisnkrpatel: 'img/avatar-ravisnkrpatel.png' }; // profile pictures; others get their initial
    var MAX_SIDE = 2400, JPEG_Q = 0.85, THUMB_SIDE = 360, THUMB_Q = 0.7;
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    // ===== Helpers =====
    var $ = function (id) { return document.getElementById(id); };
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
    function ic(name, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>'; }
    function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    function monthLabel(m) { var p = m.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
    function dayLabel(d) {
      var t = today(), y = new Date(Date.now() - 864e5); y.setMinutes(y.getMinutes() - y.getTimezoneOffset());
      if (d === t) return 'Today';
      if (d === y.toISOString().slice(0, 10)) return 'Yesterday';
      var dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }
    function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
    var toastTimer;
    function toast(msg, isErr) {
      var t = $('toast');
      t.innerHTML = '<i class="ti">' + ic(isErr ? 'alert' : 'check') + '</i><span>' + esc(msg) + '</span>';
      t.className = isErr ? 'err' : ''; t.hidden = true; void t.offsetWidth; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 5000 : 3200);
    }
    function busy(btn, on, label) {
      if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + (label ? ' ' + esc(label) : ''); }
      else if (btn.dataset.html != null) { btn.innerHTML = btn.dataset.html; delete btn.dataset.html; btn.disabled = false; }
    }

    // ===== Session & API =====
    var session = null;
    try { session = JSON.parse(store.get('vault-session') || 'null'); } catch (e) { session = null; }

    function api(action, body) {
      var payload = Object.assign({ action: action, token: session && session.token }, body || {});
      return fetch(API, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' })
        .catch(function () { throw new Error('Can’t reach the server. Check your internet and try again.'); })
        .then(function (res) {
          return res.json().catch(function () { throw new Error('Server sent an unexpected reply. Try again.'); });
        })
        .then(function (data) {
          if (!data.ok) {
            if (data.code === 'AUTH') { signOut(true); }
            var err = new Error(data.error || 'Something went wrong.'); err.code = data.code; throw err;
          }
          return data;
        });
    }

    function signOut(expired) {
      session = null; store.del('vault-session');
      state.files = []; state.full = {}; state.thumbs = {};
      closeViewer(); closeSheet(true); setSelecting(false);
      $('app').hidden = true; $('login').hidden = false;
      $('loginErr').textContent = expired ? 'Session ended. Please sign in again.' : '';
      $('p').value = '';
    }

    // ===== Login =====
    $('pwToggle').onclick = function () {
      var p = $('p'); var show = p.type === 'password'; p.type = show ? 'text' : 'password';
      this.innerHTML = ic(show ? 'eye-off' : 'eye'); this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    };
    $('loginForm').onsubmit = function (e) {
      e.preventDefault();
      var btn = $('loginBtn'); $('loginErr').textContent = '';
      busy(btn, true, 'Signing in…');
      api('login', { username: $('u').value, password: $('p').value })
        .then(function (d) {
          session = { token: d.token, user: d.user, expires: d.expires };
          store.set('vault-session', JSON.stringify(session));
          $('p').value = '';
          enterApp();
        })
        .catch(function (err) { $('loginErr').textContent = err.message; })
        .then(function () { busy(btn, false); });
    };

    // ===== App state =====
    var state = {
      month: today().slice(0, 7), cat: 'ALL', q: '', newestFirst: true,
      files: [], months: [], thumbs: {}, full: {}, loading: false,
      selecting: false, selected: {}
    };
    var visible = []; // files currently shown, in display order

    function enterApp() {
      $('login').hidden = true; $('app').hidden = false;
      $('who').textContent = session.user;
      var av = $('avatar'), pic = AVATARS[session.user];
      av.classList.toggle('img', !!pic);
      if (pic) av.innerHTML = '<img src="' + pic + '" alt="">';
      else av.textContent = (session.user || '?').charAt(0);
      renderMonths(); renderChips(); loadList();
    }

    $('logoutBtn').onclick = function () { signOut(false); };
    $('refreshBtn').onclick = function () { state.full = {}; loadList(); };
    $('themeBtn').onclick = function () {
      var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); store.set('psr-theme', t);
      $('metaTheme').setAttribute('content', t === 'light' ? '#f6f6f4' : '#0a0a0a');
    };

    // ----- month / filters -----
    function renderMonths() {
      var set = {}; set[today().slice(0, 7)] = 1; set[state.month] = 1;
      state.months.forEach(function (m) { set[m] = 1; });
      var ms = Object.keys(set).sort().reverse();
      $('monthSel').innerHTML = ms.map(function (m) { return '<option value="' + m + '"' + (m === state.month ? ' selected' : '') + '>' + monthLabel(m) + '</option>'; }).join('');
    }
    $('monthSel').onchange = function () { state.month = this.value; setSelecting(false); loadList(); };
    $('search').oninput = function () { state.q = this.value.trim().toLowerCase(); renderList(); };
    $('sortBtn').onclick = function () {
      state.newestFirst = !state.newestFirst;
      this.innerHTML = ic(state.newestFirst ? 'sort-desc' : 'sort-asc');
      this.title = state.newestFirst ? 'Newest first' : 'Oldest first';
      toast(this.title); renderList();
    };

    function renderChips() {
      var counts = { ALL: state.files.length };
      state.files.forEach(function (f) { counts[f.category] = (counts[f.category] || 0) + 1; });
      var html = '<button class="chip all" data-cat="ALL" aria-pressed="' + (state.cat === 'ALL') + '">All <span class="n">' + (counts.ALL || 0) + '</span></button>';
      CATS.forEach(function (c) {
        html += '<button class="chip" data-cat="' + c.k + '" style="--c:var(' + c.c + ')" aria-pressed="' + (state.cat === c.k) + '">' + ic(c.ic, 'sm') + c.label + ' <span class="n">' + (counts[c.k] || 0) + '</span></button>';
      });
      $('chips').innerHTML = html;
    }
    $('chips').onclick = function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.cat = b.dataset.cat; renderChips(); renderList();
    };

    // ----- list -----
    var listReq = 0;
    function loadList() {
      var my = ++listReq;
      state.loading = true; renderList();
      api('list', { month: state.month })
        .then(function (d) {
          if (my !== listReq) return;
          state.files = d.files; state.months = d.months || [];
          state.loading = false;
          renderMonths(); renderChips(); renderList(); loadThumbs();
        })
        .catch(function (err) {
          if (my !== listReq) return;
          state.loading = false; renderList(err.message);
        });
    }

    function sortFiles(a, b) {
      if (a.date !== b.date) return (a.date < b.date ? -1 : 1) * (state.newestFirst ? -1 : 1);
      var ca = CATS.findIndex(function (c) { return c.k === a.category; }), cb = CATS.findIndex(function (c) { return c.k === b.category; });
      if (ca !== cb) return ca - cb;
      return a.seq - b.seq;
    }

    function emptyState(icon, title, text, withCta) {
      return '<div class="empty"><div class="ring">' + ic(icon) + '</div><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p>' +
        (withCta ? '<button class="btn primary" data-act="cam">' + ic('camera') + 'Take photo</button>' : '') + '</div>';
    }

    function renderList(errMsg) {
      var el = $('list');
      if (state.loading) { el.innerHTML = '<div class="loading">' + '<div class="skel"></div>'.repeat(4) + '</div>'; return; }
      if (errMsg) {
        el.innerHTML = '<div class="empty"><div class="ring">' + ic('alert') + '</div><h4>Couldn’t load bills</h4><p>' + esc(errMsg) + '</p><button class="btn" id="retryList">' + ic('refresh') + 'Try again</button></div>';
        $('retryList').onclick = loadList; return;
      }
      var q = state.q;
      visible = state.files.filter(function (f) {
        if (state.cat !== 'ALL' && f.category !== state.cat) return false;
        if (!q) return true;
        var label = CAT[f.category] ? CAT[f.category].label : '';
        return (f.name + ' ' + f.note + ' ' + f.by + ' ' + f.date + ' ' + label + ' ' + dayLabel(f.date)).toLowerCase().indexOf(q) !== -1;
      }).sort(sortFiles);

      if (!visible.length) {
        el.innerHTML = state.files.length
          ? emptyState('search', 'Nothing matches', 'Try a different type or search word.', false)
          : emptyState('folder', 'No bills in ' + monthLabel(state.month), 'Photos you save for this month will show up here.', state.month === today().slice(0, 7));
        var cta = el.querySelector('[data-act="cam"]'); if (cta) cta.onclick = function () { $('camBtn').click(); };
        return;
      }
      var html = '', lastDay = null, i;
      for (i = 0; i < visible.length; i++) {
        var f = visible[i];
        if (f.date !== lastDay) {
          if (lastDay !== null) html += '</div>';
          var n = visible.filter(function (x) { return x.date === f.date; }).length;
          html += '<div class="day"><h3>' + esc(dayLabel(f.date)) + '</h3><span class="cnt">' + n + ' bill' + (n > 1 ? 's' : '') + '</span></div><div class="grid">';
          lastDay = f.date;
        }
        var c = CAT[f.category] || CAT.OTHER, th = state.thumbs[f.id];
        var sub = [f.note, f.by].filter(Boolean).join(' · ');
        html += '<button class="card' + (state.selected[f.id] ? ' sel' : '') + '" data-id="' + esc(f.id) + '" style="--c:var(' + c.c + ')">' +
          '<div class="thumb">' + (th ? '<img loading="lazy" alt="" src="data:image/jpeg;base64,' + th + '">' : ic('file')) +
          '<span class="tag">' + ic(c.ic) + esc(c.label) + '</span>' +
          '<span class="seq">#' + ('00' + (f.seq || 0)).slice(-3) + '</span>' +
          '<i class="check">' + ic('check') + '</i></div>' +
          '<div class="meta"><span class="name">' + esc(f.name) + '</span>' +
          '<span class="sub">' + esc(sub || fmtSize(f.size)) + '</span></div></button>';
      }
      html += '</div>';
      el.innerHTML = html;
    }

    $('list').onclick = function (e) {
      var card = e.target.closest('.card'); if (!card) return;
      var id = card.dataset.id;
      if (state.selecting) {
        if (state.selected[id]) delete state.selected[id]; else state.selected[id] = true;
        card.classList.toggle('sel', !!state.selected[id]); updateSelbar(); return;
      }
      openViewer(visible.findIndex(function (f) { return f.id === id; }));
    };

    function loadThumbs() {
      var groups = {}, any = false;
      state.files.forEach(function (f) {
        if (state.thumbs[f.id]) return;
        var key = f.category + '|' + f.date.slice(0, 7);
        (groups[key] = groups[key] || []).push(f.id); any = true;
      });
      if (!any) return;
      api('thumbs', { groups: groups }).then(function (d) {
        Object.assign(state.thumbs, d.thumbs || {});
        renderList();
      }).catch(function () { /* previews are optional */ });
    }

    // ----- selection -----
    function setSelecting(on) {
      state.selecting = on; state.selected = {};
      var b = $('selectBtn');
      b.innerHTML = on ? ic('x') + '<span>Done</span>' : ic('check-sq') + '<span>Select</span>';
      b.classList.toggle('active', on);
      $('main').classList.toggle('selecting', on);
      $('selbar').hidden = !on; document.body.classList.toggle('has-selbar', on);
      document.querySelectorAll('.card.sel').forEach(function (c) { c.classList.remove('sel'); });
      updateSelbar();
    }
    function selectedFiles() { return visible.filter(function (f) { return state.selected[f.id]; }); }
    function updateSelbar() {
      var n = selectedFiles().length;
      $('selCount').innerHTML = '<b>' + n + '</b> selected';
      $('selPng').disabled = $('selPdf').disabled = !n;
      $('selAll').textContent = n && n === visible.length ? 'None' : 'All';
    }
    $('selectBtn').onclick = function () { setSelecting(!state.selecting); };
    $('selAll').onclick = function () {
      var all = selectedFiles().length !== visible.length;
      state.selected = {}; if (all) visible.forEach(function (f) { state.selected[f.id] = true; });
      renderList(); updateSelbar();
    };
    $('selPdf').onclick = function () {
      var files = selectedFiles(), btn = this;
      busy(btn, true);
      fetchAll(files, function (i) { btn.innerHTML = '<span class="spinner"></span> ' + i + '/' + files.length; })
        .then(function (items) {
          var name = files.length === 1 ? files[0].name.replace(/\.\w+$/, '') : 'Bills_' + state.month + '_' + files.length + '-files';
          return makePdf(items, name + '.pdf');
        })
        .then(function () { toast('PDF downloaded'); })
        .catch(function (err) { toast(err.message, true); })
        .then(function () { busy(btn, false); });
    };
    $('selPng').onclick = function () {
      var files = selectedFiles(), btn = this;
      busy(btn, true);
      fetchAll(files, function (i) { btn.innerHTML = '<span class="spinner"></span> ' + i + '/' + files.length; })
        .then(function (items) {
          return items.reduce(function (p, it) { return p.then(function () { return downloadPng(it).then(function () { return wait(400); }); }); }, Promise.resolve());
        })
        .then(function () { toast(files.length + ' PNG' + (files.length > 1 ? 's' : '') + ' downloaded'); })
        .catch(function (err) { toast(err.message, true); })
        .then(function () { busy(btn, false); });
    };
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // ===== Full images & downloads =====
    function getFull(f) {
      if (state.full[f.id]) return Promise.resolve(state.full[f.id]);
      return api('file', { id: f.id }).then(function (d) {
        var item = { name: d.name, src: 'data:' + d.mimeType + ';base64,' + d.data, mime: d.mimeType };
        state.full[f.id] = item; return item;
      });
    }
    function fetchAll(files, onProgress) {
      var out = [], i = 0;
      return files.reduce(function (p, f) {
        return p.then(function () { return getFull(f); }).then(function (it) { out.push(it); onProgress(++i); });
      }, Promise.resolve()).then(function () { return out; });
    }
    function loadImg(src) {
      return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { rej(new Error('Could not open image.')); }; im.src = src; });
    }
    function saveBlob(blob, name) {
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    }
    function downloadPng(item) {
      return loadImg(item.src).then(function (im) {
        var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext('2d').drawImage(im, 0, 0);
        return new Promise(function (res, rej) {
          c.toBlob(function (b) { if (!b) return rej(new Error('Could not make PNG.')); saveBlob(b, item.name.replace(/\.\w+$/, '') + '.png'); res(); }, 'image/png');
        });
      });
    }
    function makePdf(items, filename) {
      if (!window.jspdf) return Promise.reject(new Error('PDF tool still loading — try again in a second.'));
      var doc = null, M = 8;
      return items.reduce(function (p, it) {
        return p.then(function () { return loadImg(it.src); }).then(function (im) {
          var land = im.naturalWidth > im.naturalHeight, orient = land ? 'l' : 'p';
          if (!doc) doc = new window.jspdf.jsPDF({ orientation: orient, unit: 'mm', format: 'a4', compress: true });
          else doc.addPage('a4', orient);
          var pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
          var s = Math.min((pw - 2 * M) / im.naturalWidth, (ph - 2 * M) / im.naturalHeight);
          var w = im.naturalWidth * s, h = im.naturalHeight * s;
          doc.addImage(it.src, /png/i.test(it.mime) ? 'PNG' : 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
        });
      }, Promise.resolve()).then(function () { saveBlob(doc.output('blob'), filename); });
    }

    // ===== Viewer =====
    var vIndex = -1, vToken = 0;
    function openViewer(i) {
      if (i < 0 || i >= visible.length) return;
      vIndex = i; var f = visible[i], c = CAT[f.category] || CAT.OTHER, my = ++vToken;
      $('viewer').hidden = false; document.body.style.overflow = 'hidden';
      $('vName').textContent = f.name;
      $('vPos').textContent = (i + 1) + ' of ' + visible.length;
      $('vInfo').innerHTML =
        '<span class="pill cat" style="--c:var(' + c.c + ')">' + ic(c.ic) + esc(c.label) + '</span>' +
        '<span class="pill">' + ic('calendar') + esc(dayLabel(f.date)) + '</span>' +
        (f.note ? '<span class="pill">' + ic('note') + esc(f.note) + '</span>' : '') +
        (f.by ? '<span class="pill">' + ic('user') + esc(f.by) + '</span>' : '') +
        '<span class="pill">' + ic('hdd') + fmtSize(f.size) + '</span>';
      $('vPrev').hidden = i === 0; $('vNext').hidden = i === visible.length - 1;
      var img = $('vImg'), th = state.thumbs[f.id];
      if (th) { img.src = 'data:image/jpeg;base64,' + th; img.hidden = false; } else { img.hidden = true; }
      $('vSpin').hidden = false;
      ['vPng', 'vPdf', 'vDel'].forEach(function (b) { $(b).disabled = true; });
      getFull(f).then(function (it) {
        if (my !== vToken) return;
        img.src = it.src; img.hidden = false; $('vSpin').hidden = true;
        ['vPng', 'vPdf', 'vDel'].forEach(function (b) { $(b).disabled = false; });
      }).catch(function (err) {
        if (my !== vToken) return;
        $('vSpin').hidden = true; $('vDel').disabled = false; toast(err.message, true);
      });
    }
    function closeViewer() { vToken++; $('viewer').hidden = true; document.body.style.overflow = ''; $('vImg').removeAttribute('src'); }
    $('vClose').onclick = closeViewer;
    $('vPrev').onclick = function () { openViewer(vIndex - 1); };
    $('vNext').onclick = function () { openViewer(vIndex + 1); };
    document.addEventListener('keydown', function (e) {
      if (!$('viewer').hidden) {
        if (e.key === 'Escape') closeViewer();
        else if (e.key === 'ArrowLeft') openViewer(vIndex - 1);
        else if (e.key === 'ArrowRight') openViewer(vIndex + 1);
      } else if (!$('saveSheet').hidden && e.key === 'Escape') closeSheet();
    });
    (function () {
      var x0 = null, y0 = 0, body = $('vBody');
      body.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, { passive: true });
      body.addEventListener('touchend', function (e) {
        if (x0 === null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) openViewer(vIndex + (dx < 0 ? 1 : -1));
      });
    })();
    $('vPng').onclick = function () {
      var f = visible[vIndex], btn = this; busy(btn, true);
      getFull(f).then(downloadPng).then(function () { toast('PNG downloaded'); })
        .catch(function (err) { toast(err.message, true); }).then(function () { busy(btn, false); });
    };
    $('vPdf').onclick = function () {
      var f = visible[vIndex], btn = this; busy(btn, true);
      getFull(f).then(function (it) { return makePdf([it], f.name.replace(/\.\w+$/, '') + '.pdf'); })
        .then(function () { toast('PDF downloaded'); })
        .catch(function (err) { toast(err.message, true); }).then(function () { busy(btn, false); });
    };
    $('vDel').onclick = function () {
      var f = visible[vIndex], btn = this;
      if (!confirm('Delete ' + f.name + '?\n\nIt goes to the Google Drive bin and can be restored there for 30 days.')) return;
      busy(btn, true);
      api('trash', { id: f.id }).then(function () {
        state.files = state.files.filter(function (x) { return x.id !== f.id; });
        delete state.full[f.id]; delete state.thumbs[f.id];
        renderChips(); renderList();
        if (visible.length) openViewer(Math.min(vIndex, visible.length - 1)); else closeViewer();
        toast('Moved to Drive bin');
      }).catch(function (err) { toast(err.message, true); }).then(function () { busy(btn, false); });
    };

    // ===== Capture & save =====
    var queue = [], queueTotal = 0, cur = null; // cur = { src: ImageBitmap|HTMLImageElement, rot }
    var chosenCat = null;

    $('camBtn').onclick = function () { $('camIn').value = ''; $('camIn').click(); };
    $('galBtn').onclick = function () { $('galIn').value = ''; $('galIn').click(); };
    $('camIn').onchange = function () { startQueue(this.files); };
    $('galIn').onchange = function () { startQueue(this.files); };

    function startQueue(fileList) {
      var files = Array.prototype.filter.call(fileList || [], function (f) { return /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name); });
      if (!files.length) return;
      queue = files; queueTotal = files.length;
      $('billDate').value = today(); $('billNote').value = '';
      nextInQueue();
    }

    function nextInQueue() {
      if (!queue.length) { closeSheet(true); return; }
      var file = queue.shift();
      chosenCat = null; renderTypes(); updateHint();
      $('saveErr').textContent = ''; $('billNote').value = '';
      $('queueInfo').textContent = queueTotal > 1 ? (queueTotal - queue.length) + ' / ' + queueTotal : '';
      $('saveSheet').hidden = false; document.body.style.overflow = 'hidden';
      var cv = $('previewCanvas'); cv.width = 1; cv.height = 1;
      decode(file).then(function (src) {
        cur = { src: src, rot: 0 }; drawPreview();
      }).catch(function () {
        $('saveErr').textContent = 'This photo format can’t be opened here. Try taking it with the camera button.';
        cur = null; updateSaveBtn();
      });
    }

    function decode(file) {
      if (window.createImageBitmap) {
        return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return decodeViaImg(file); });
      }
      return decodeViaImg(file);
    }
    function decodeViaImg(file) {
      var url = URL.createObjectURL(file);
      return loadImg(url).then(function (im) { URL.revokeObjectURL(url); return im; }, function (e) { URL.revokeObjectURL(url); throw e; });
    }
    function srcSize(s) { return { w: s.naturalWidth || s.width, h: s.naturalHeight || s.height }; }

    /** Draws cur.src rotated by cur.rot into a canvas whose longest side is <= maxSide. */
    function render(maxSide) {
      var sz = srcSize(cur.src), scale = Math.min(1, maxSide / Math.max(sz.w, sz.h));
      var w = Math.round(sz.w * scale), h = Math.round(sz.h * scale), turn = cur.rot % 180 !== 0;
      var c = document.createElement('canvas'); c.width = turn ? h : w; c.height = turn ? w : h;
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.translate(c.width / 2, c.height / 2); g.rotate(cur.rot * Math.PI / 180);
      g.imageSmoothingQuality = 'high';
      g.drawImage(cur.src, -w / 2, -h / 2, w, h);
      return c;
    }
    function drawPreview() {
      var small = render(1000), cv = $('previewCanvas');
      cv.width = small.width; cv.height = small.height; cv.getContext('2d').drawImage(small, 0, 0);
      updateSaveBtn();
    }
    $('rotBtn').onclick = function () { if (!cur) return; cur.rot = (cur.rot + 90) % 360; drawPreview(); };

    function renderTypes() {
      $('types').innerHTML = CATS.map(function (c) {
        return '<button type="button" class="type" role="radio" data-k="' + c.k + '" style="--c:var(' + c.c + ')" aria-checked="' + (chosenCat === c.k) + '"><span class="ic">' + ic(c.ic) + '</span>' + c.label + '</button>';
      }).join('');
    }
    $('types').onclick = function (e) {
      var b = e.target.closest('.type'); if (!b) return;
      chosenCat = b.dataset.k; renderTypes(); updateHint(); updateSaveBtn();
    };
    $('billDate').onchange = function () { updateHint(); updateSaveBtn(); };

    function updateHint() {
      var d = $('billDate').value, el = $('fileHint');
      el.classList.remove('ready'); el.style.removeProperty('--c');
      if (!chosenCat || !d) {
        el.innerHTML = '<span class="fi">' + ic('file') + '</span><span class="fn"><span>' + (!chosenCat ? 'Pick a bill type to see the file name' : 'Pick the bill date') + '</span></span>';
        return;
      }
      var known = state.files.filter(function (f) { return f.category === chosenCat && f.date === d; })
        .reduce(function (m, f) { return Math.max(m, f.seq || 0); }, 0);
      var guess = d.slice(0, 7) === state.month ? ('00' + (known + 1)).slice(-3) : 'NNN';
      var c = CAT[chosenCat];
      el.classList.add('ready'); el.style.setProperty('--c', 'var(' + c.c + ')');
      el.innerHTML = '<span class="fi">' + ic(c.ic) + '</span><span class="fn"><b>' + chosenCat + '_' + d + '_' + guess + '.jpg</b>' +
        '<small>' + ic('folder', 'sm') + 'Invoice Vault / ' + esc(c.label) + ' / ' + d.slice(0, 7) + '</small></span>';
    }
    function updateSaveBtn() { $('saveBtn').disabled = !(cur && chosenCat && $('billDate').value); }

    function closeSheet(force) {
      if (!force) {
        if ($('saveBtn').dataset.html != null) return; // upload in progress
        if (cur && !confirm('Discard this photo?')) return;
      }
      queue = []; cur = null; $('saveSheet').hidden = true;
      if ($('viewer').hidden) document.body.style.overflow = '';
    }
    $('saveClose').onclick = function () { closeSheet(false); };
    $('saveSheet').addEventListener('click', function (e) { if (e.target === this) closeSheet(false); });
    $('retakeBtn').onclick = function () { queue = []; closeSheet(true); $('camIn').value = ''; $('camIn').click(); };

    function canvasB64(c, q) {
      return new Promise(function (res, rej) {
        c.toBlob(function (b) {
          if (!b) return rej(new Error('Could not process photo.'));
          var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = function () { rej(new Error('Could not process photo.')); }; r.readAsDataURL(b);
        }, 'image/jpeg', q);
      });
    }

    $('saveForm').onsubmit = function (e) {
      e.preventDefault();
      if (!cur || !chosenCat) return;
      var btn = $('saveBtn'), date = $('billDate').value, note = $('billNote').value.trim(), cat = chosenCat;
      $('saveErr').textContent = ''; busy(btn, true, 'Saving…'); $('retakeBtn').disabled = true;
      var full = render(MAX_SIDE), thumb = render(THUMB_SIDE), thumbB64;
      canvasB64(thumb, THUMB_Q).then(function (t) { thumbB64 = t; return canvasB64(full, JPEG_Q); })
        .then(function (data) {
          return api('upload', { category: cat, date: date, note: note, data: data, mimeType: 'image/jpeg', thumb: thumbB64 });
        })
        .then(function (d) {
          state.thumbs[d.file.id] = thumbB64;
          if (d.file.date.slice(0, 7) === state.month) {
            state.files.push(d.file); renderChips(); renderList();
          } else if (state.months.indexOf(d.file.date.slice(0, 7)) === -1) {
            state.months.push(d.file.date.slice(0, 7)); renderMonths();
          }
          toast('Saved as ' + d.file.name);
          busy(btn, false); $('retakeBtn').disabled = false;
          nextInQueue();
        })
        .catch(function (err) {
          busy(btn, false); $('retakeBtn').disabled = false; updateSaveBtn();
          $('saveErr').textContent = err.message + ' Your photo is still here — tap Save to retry.';
        });
    };

    // ===== Start =====
    if (session && session.token && session.expires > Date.now()) enterApp();
    else { store.del('vault-session'); session = null; $('login').hidden = false; }
  })();
  </script>
</body>

</html>
